<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Started - Contact Us | All Marketing Experts</title>
    <meta name="description" content="Contact All Marketing Experts in Long Island, NY. Schedule a free consultation to evaluate your website design and SEO today.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header Placeholder -->
    <div id="header-placeholder"></div>

    <!-- Hero Section -->
    <section class="hero-section" style="padding-bottom: 4rem;">
        <div class="container" style="text-align: center; max-width: 800px;">
            <h1 class="hero-title" style="font-size: 3.5rem; margin-bottom: 1rem;">Get Started!</h1>
            <p style="font-size: 1.25rem; font-weight: 500; color: var(--primary-color);">Reach out for a free consultation. Let's grow your business together.</p>
        </div>
    </section>

    <!-- Contact Form & Info -->
    <section class="section section-bg">
        <div class="container contact-container">
            <!-- Form Block -->
            <div class="contact-form-wrap">
                <h3 style="font-size: 1.8rem; margin-bottom: 1.5rem; color: var(--dark-color);">Request a Consultation</h3>
                <form id="expert-contact-form">
                    <div class="form-group">
                        <label for="form-name">Name *</label>
                        <input type="text" id="form-name" class="form-control" placeholder="Enter your name" required>
                    </div>
                    <div class="form-group">
                        <label for="form-email">Email Address *</label>
                        <input type="email" id="form-email" class="form-control" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group">
                        <label for="form-phone">Phone Number</label>
                        <input type="tel" id="form-phone" class="form-control" placeholder="Enter your phone number">
                    </div>
                    <div class="form-group">
                        <label for="form-company">Company Name</label>
                        <input type="text" id="form-company" class="form-control" placeholder="Enter your company name">
                    </div>
                    <div class="form-group">
                        <label for="form-message">Message *</label>
                        <textarea id="form-message" class="form-control" placeholder="Tell us about your business goals" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 1rem;">Send Message</button>
                </form>
            </div>
            
            <!-- Info Block -->
            <div class="contact-info-wrap">
                <h3 style="font-size: 1.8rem; margin-bottom: 2rem; color: var(--dark-color);">Contact Information</h3>
                
                <div class="contact-card">
                    <div class="contact-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                    </div>
                    <div class="contact-detail">
                        <h5>Call Us</h5>
                        <p style="font-size: 1.1rem; font-weight: 600; color: var(--primary-color);">516-862-2653</p>
                    </div>
                </div>

                <div class="contact-card">
                    <div class="contact-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                    </div>
                    <div class="contact-detail">
                        <h5>Email Us</h5>
                        <p style="font-size: 1.1rem; font-weight: 600; color: var(--primary-color);">info@allmarketingexperts.com</p>
                    </div>
                </div>

                <div class="contact-card">
                    <div class="contact-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                    </div>
                    <div class="contact-detail">
                        <h5>Office Location</h5>
                        <p style="font-size: 1.05rem;">Long Island, New York, NY</p>
                    </div>
                </div>

                <!-- Simple Map Placeholder -->
                <div style="border-radius: 12px; overflow: hidden; box-shadow: var(--card-shadow); border: 1px solid rgba(0,0,0,0.05); margin-top: 3rem;">
                    <svg width="100%" height="200" viewBox="0 0 300 200" fill="none" xmlns="http://www.w3.org/2000/svg" style="background-color: #e2e8f0;">
                        <!-- Grid lines representing roads -->
                        <line x1="50" y1="0" x2="50" y2="200" stroke="#cbd5e1" stroke-width="4"/>
                        <line x1="150" y1="0" x2="150" y2="200" stroke="#cbd5e1" stroke-width="8"/>
                        <line x1="250" y1="0" x2="250" y2="200" stroke="#cbd5e1" stroke-width="4"/>
                        <line x1="0" y1="60" x2="300" y2="60" stroke="#cbd5e1" stroke-width="6"/>
                        <line x1="0" y1="140" x2="300" y2="140" stroke="#cbd5e1" stroke-width="6"/>
                        <!-- Marker -->
                        <circle cx="150" cy="100" r="10" fill="var(--primary-color)" fill-opacity="0.3"/>
                        <circle cx="150" cy="100" r="4" fill="var(--primary-color)"/>
                    </svg>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <script src="js/main.js"></script>
    <script src="js/contact.js"></script>
</body>
</html>
